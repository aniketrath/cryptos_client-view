name: Node.js CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # Docker Build and Push
  push_docker:
    runs-on: ubuntu-latest # Only runs on Ubuntu (Linux)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWD_TOKEN }}

      - name: List files in the repository
        run: ls -la

      - name: Build and push Docker image
        run: |
          IMAGE_NAME="${{ github.repository }}"
          LOWERCASE_IMAGE_NAME=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')
          COMMIT_SHA="${{ github.sha }}"
          TAG="${LOWERCASE_IMAGE_NAME}:${COMMIT_SHA::7}"
          docker buildx build --file Dockerfile --tag $TAG --push .
